<app-sidebar></app-sidebar>
<div class="content">
    <header class="header">
        <div class="header-info">
            <h2>Patients</h2>
            <p>Open, Monitor and Close patients files</p>
        </div>
        <div class="header-actions">
            <input type="text" placeholder="Search..." class="search-input">
            <button class="filter-button"><img src="qr_code.svg" alt="Filter" class="filter-icon"></button>
            <button type="button" class="add-patient-button row" routerLink="/add-patients">
                <img src="plus.svg" alt="Add Patient Icon" class="add-patient-icon">
                <span>Add Patient</span>
            </button>
        </div>
    </header>
    <table>
        <thead>
            <tr>
                <th>File Number</th>
                <th>First Name</th>
                <th>Father Name</th>
                <th>Last Name</th>
                <th>Phone 1</th>
                <th>Phone 2</th>
            </tr>
        </thead>
        <tbody>

            @for ( patient of patients; track patient.fileNumber ){
                <tr class="patinet-rows" [routerLink]="['/patient', patient.fileNumber]">
                    <td>{{patient.fileNumber}}</td>
                    <td>{{patient.firstName}}</td>
                    <td>{{patient.fatherName}}</td>
                    <td>{{patient.lastName}}</td>
                    <td>{{patient.phone1}}</td>
                    <td>{{patient.phone2}}</td>
                </tr>
            }
        </tbody>
    </table>
</div>
